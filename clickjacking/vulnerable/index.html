<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vulnerable Clickjacking Target</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        button {
            position: fixed;
            top: 130px;
            left: 30px;
            padding: 10px 18px;
        }

        #result {
            position: fixed;
            top: 175px;
            left: 30px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <button onclick="document.getElementById('result').textContent='Target button clicked successfully!'">
        Click Me
    </button>

    <p id="result"></p>
</body>
</html>
